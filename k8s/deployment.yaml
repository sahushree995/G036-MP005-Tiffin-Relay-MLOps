apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp005-api
  labels:
    app: mp005-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp005-api
  template:
    metadata:
      labels:
        app: mp005-api
    spec:
      containers:
        - name: mp005-api
          image: mp005-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
